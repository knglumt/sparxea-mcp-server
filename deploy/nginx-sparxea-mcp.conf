# nginx reverse proxy config, alternative to deploy/Caddyfile if you
# already run nginx elsewhere and would rather not add Caddy.
#
# Install:
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-sparxea-mcp.conf /etc/nginx/sites-available/sparxea-mcp
#   # edit the domain name below first
#   sudo ln -s /etc/nginx/sites-available/sparxea-mcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.your-domain.example.com
#
# certbot rewrites this file in place to add the TLS server block and set
# up auto-renewal - the server block below is deliberately just the
# plain-HTTP starting point certbot expects.

server {
    listen 80;
    server_name mcp.your-domain.example.com;

    location /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        # MCP's streamable-http transport uses long-lived requests
        # (server-sent events) for the response stream.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
